# Local development harness — builds the three images from source against a
# local ./vault directory. Production does NOT run from this file: it runs on
# Kubernetes, manifests in the infra-k8s repo (see README "Deployment").
name: obsidian-stack

volumes:
  vault:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VAULT_HOST_PATH:-./vault}

services:
  sync:
    build: ./sync
    volumes:
      - vault:/vault
      - ./sync-config:/home/node/.config/obsidian-headless
    environment:
      OBSIDIAN_AUTH_TOKEN: ${OBSIDIAN_AUTH_TOKEN:-}
      VAULT_NAME: ${VAULT_NAME:-}
    stop_grace_period: 30s

  # Service name is a contract: the MCP server hardcodes http://web-clipper:3000
  web-clipper:
    build: ./clipper
    volumes:
      - vault:/vault
    environment:
      VAULT_PATH: /vault
      BROWSER_TIMEOUT_MS: ${BROWSER_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MODE: server
      PORT: ${PORT:-3000}
    shm_size: 512m          # Chromium shared memory
    init: true
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 2g

  mcp-server:
    build: ./mcp-server
    volumes:
      - vault:/vault
    environment:
      VAULT_PATH: /vault
      MCP_PORT: ${MCP_PORT:-4000}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://localhost:4000}
      POCKET_ID_ISSUER: ${POCKET_ID_ISSUER:-https://id.example.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "4000:4000"
    depends_on: [web-clipper]
    deploy:
      resources:
        limits:
          memory: 256m
