name: Propagate to infra-control

on:
  push:
    branches: [main, master]

jobs:
  propagate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CD_APP_ID }}
          private-key: ${{ secrets.CD_APP_PRIVATE_KEY }}
          repositories: "infra-control"

      - name: Get current commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get stack name
        id: stack
        run: echo "name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Checkout infra-control
        uses: actions/checkout@v6
        with:
          repository: ab-craft/infra-control
          token: ${{ steps.app-token.outputs.token }}
          path: infra-control

      - name: Install yq
        run: |
          curl -sSfL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Update lock
        run: |
          cd infra-control
          yq -i '.stacks.${{ steps.stack.outputs.name }}.ref = "${{ steps.sha.outputs.sha }}"' locks/prod.yaml
          yq -i '.stacks.${{ steps.stack.outputs.name }}.deployed_at = "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"' locks/prod.yaml
          yq -i '.stacks.${{ steps.stack.outputs.name }}.deployed_by = "github-actions[bot]"' locks/prod.yaml

      - name: Create and merge promotion PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          STACK="${{ steps.stack.outputs.name }}"
          SHA="${{ steps.sha.outputs.sha }}"
          BRANCH="promote-${STACK}-${SHA}"

          cd infra-control
          git checkout -b "$BRANCH"
          git add locks/prod.yaml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "promote: ${STACK} → ${SHA}"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --repo ab-craft/infra-control \
            --head "$BRANCH" \
            --title "promote: ${STACK} → ${SHA}" \
            --body "$(cat <<EOF
          Triggered by merge in \`${{ github.repository }}\`

          **Commit:** ${{ github.server_url }}/${{ github.repository }}/commit/${SHA}
          **Compare:** ${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.before }}...${SHA}
          EOF
          )" \
            --label promotion)

          gh pr merge "$PR_URL" --squash --repo ab-craft/infra-control
